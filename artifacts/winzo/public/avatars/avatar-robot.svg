<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <ellipse cx="100" cy="92" rx="64" ry="58" fill="#38bdf8" opacity="0.14"/>
  <!-- antenna -->
  <line x1="100" y1="30" x2="100" y2="52" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="9" fill="#f43f5e"/>
  <circle cx="100" cy="26" r="4" fill="#fecdd3"/>
  <!-- head -->
  <rect x="46" y="52" width="108" height="96" rx="26" fill="url(#metal)"/>
  <rect x="46" y="52" width="108" height="30" rx="15" fill="#bfdbfe" opacity="0.45"/>
  <!-- visor -->
  <rect x="58" y="82" width="84" height="34" rx="17" fill="#0b1220"/>
  <!-- eyes -->
  <circle cx="82" cy="99" r="9" fill="#22d3ee"/>
  <circle cx="118" cy="99" r="9" fill="#22d3ee"/>
  <circle cx="80" cy="96" r="3.4" fill="#ecfeff"/>
  <circle cx="116" cy="96" r="3.4" fill="#ecfeff"/>
  <!-- mouth grill -->
  <rect x="80" y="126" width="40" height="8" rx="4" fill="#0b1220"/>
  <line x1="88" y1="126" x2="88" y2="134" stroke="#38bdf8" stroke-width="2.6"/>
  <line x1="100" y1="126" x2="100" y2="134" stroke="#38bdf8" stroke-width="2.6"/>
  <line x1="112" y1="126" x2="112" y2="134" stroke="#38bdf8" stroke-width="2.6"/>
  <!-- ear bolts -->
  <circle cx="42" cy="100" r="9" fill="#1e40af"/>
  <circle cx="158" cy="100" r="9" fill="#1e40af"/>
  <circle cx="42" cy="100" r="4" fill="#93c5fd"/>
  <circle cx="158" cy="100" r="4" fill="#93c5fd"/>
  <!-- neck -->
  <rect x="88" y="148" width="24" height="12" rx="5" fill="#1e3a8a"/>
</svg>
